<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản - Bootstrap Forms</title>
    <!-- Nhúng CSS Bootstrap 5 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light py-5">

    <div class="container">
        <div class="row justify-content-center">
            <!-- Điều chỉnh độ rộng: 12 cột trên mobile, 8 cột trên tablet, 6 cột trên desktop -->
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card shadow-sm border-0 rounded-3 p-4 p-md-5 bg-white">
                    
                    <!-- Tiêu đề form -->
                    <div class="text-center mb-4">
                        <h2 class="fw-bold text-primary">Tạo Tài Khoản</h2>
                        <p class="text-muted small">Vui lòng điền đầy đủ các thông tin bên dưới để đăng ký</p>
                    </div>

                    <form action="#" method="POST">
                        
                        <!-- 1. Họ và tên -->
                        <div class="mb-3">
                            <label for="fullName" class="form-label fw-semibold">Họ và tên</label>
                            <input type="text" class="form-control" id="fullName" placeholder="Nguyễn Văn A" required>
                        </div>

                        <!-- 2. Email -->
                        <div class="mb-3">
                            <label for="userEmail" class="form-label fw-semibold">Địa chỉ Email</label>
                            <input type="email" class="form-control" id="userEmail" placeholder="name@example.com" required>
                            <div class="form-text text-muted">Chúng tôi cam kết không chia sẻ email của bạn với bất kỳ ai.</div>
                        </div>

                        <!-- 3. Mật khẩu & 4. Xác nhận mật khẩu (chia 2 cột trên desktop) -->
                        <div class="row g-3 mb-3">
                            <div class="col-sm-6">
                                <label for="password" class="form-label fw-semibold">Mật khẩu</label>
                                <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                            </div>
                            <div class="col-sm-6">
                                <label for="confirmPassword" class="form-label fw-semibold">Xác nhận mật khẩu</label>
                                <input type="password" class="form-control" id="confirmPassword" placeholder="••••••••" required>
                            </div>
                        </div>

                        <!-- 5. Giới tính (Radio buttons) -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold d-block">Giới tính</label>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="gender" id="genderMale" value="male" checked>
                                <label class="form-check-label" for="genderMale">Nam</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="gender" id="genderFemale" value="female">
                                <label class="form-check-label" for="genderFemale">Nữ</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="gender" id="genderOther" value="other">
                                <label class="form-check-label" for="genderOther">Khác</label>
                            </div>
                        </div>

                        <!-- 6. Sở thích (Checkboxes) -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold d-block">Sở thích</label>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="hobbyCoding" value="coding">
                                <label class="form-check-label" for="hobbyCoding">Lập trình</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="hobbyMusic" value="music">
                                <label class="form-check-label" for="hobbyMusic">Âm nhạc</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="hobbySports" value="sports">
                                <label class="form-check-label" for="hobbySports">Thể thao</label>
                            </div>
                        </div>

                        <!-- 7. Quốc gia (Dropdown Select) -->
                        <div class="mb-4">
                            <label for="countrySelect" class="form-label fw-semibold">Quốc gia</label>
                            <select class="form-select" id="countrySelect" required>
                                <option value="" selected disabled>-- Chọn quốc gia của bạn --</option>
                                <option value="VN">Việt Nam</option>
                                <option value="US">Hoa Kỳ</option>
                                <option value="JP">Nhật Bản</option>
                                <option value="KR">Hàn Quốc</option>
                                <option value="OTHER">Khác</option>
                            </select>
                        </div>

                        <!-- Điều khoản dịch vụ -->
                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" id="termsCheck" required>
                            <label class="form-check-label small text-muted" for="termsCheck">
                                Tôi đồng ý với <a href="#" class="text-decoration-none">Điều khoản và Chính sách bảo mật</a>
                            </label>
                        </div>

                        <!-- 8. Nút Submit -->
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm">
                            Đăng Ký Ngay
                        </button>

                        <!-- Liên kết chuyển hướng đăng nhập -->
                        <div class="text-center mt-3">
                            <span class="small text-muted">Đã có tài khoản? </span>
                            <a href="#" class="small text-decoration-none fw-semibold">Đăng nhập tại đây</a>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Nhúng Bootstrap JavaScript Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
